services:

  rstudio:
    image: rocker/rstudio:latest
    restart: always
    environment:
      PASSWORD: test123
      ADD: shiny
    ports:
      - 9090:8787
    networks:
      - r-jupyter-dev-net
    volumes:
      # Use DOCKER_DATA_PATH or fall back to the user's home directory
      - ${DOCKER_DATA_PATH:-$HOME}:/home/rstudio
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      
  jupyterlab:
    image: jupyter/tensorflow-notebook
    restart: always
    ports:
      - 10000:8888
    networks:
      - r-jupyter-dev-net
    volumes:
      - ${DOCKER_DATA_PATH:-$HOME}:/home/jovyan/home
      - ${DOCKER_DATA_PATH_2:-$HOME}:/home/jovyan/home2
    user: jovyan
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command: bash -c "start.sh jupyter lab"

networks:
  r-jupyter-dev-net:
    external: false